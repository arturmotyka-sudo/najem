<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f5e">
<title>Najem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="house-192.png">
<link rel="apple-touch-icon" href="house-192.png">
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1d2321;--mute:#6b7470;--line:#e3e6e1;--acc:#2f6f5e;--onacc:#fff;--acc2:#e6efeb;--warn:#a5680f;--warnbg:#fbf0dc;--bad:#c62828;--badbg:#fbeaea;--ok:#2f6f5e;--vivid:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111413;--card:#1a1e1d;--ink:#e8ece9;--mute:#97a19c;--line:#2a302e;--acc:#6cc2a6;--onacc:#0d1f19;--acc2:#1e2c27;--warn:#e3ab4f;--warnbg:#2e2617;--bad:#ef6b6b;--badbg:#3a1d1f;--ok:#6cc2a6;--vivid:#22c55e}}
:root[data-theme=dark]{--bg:#111413;--card:#1a1e1d;--ink:#e8ece9;--mute:#97a19c;--line:#2a302e;--acc:#6cc2a6;--onacc:#0d1f19;--acc2:#1e2c27;--warn:#e3ab4f;--warnbg:#2e2617;--bad:#ef6b6b;--badbg:#3a1d1f;--ok:#6cc2a6;--vivid:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select,a{touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 58px 4px;display:flex;align-items:center;justify-content:center}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{background:var(--card);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;border:1px solid var(--line);flex:none}
.mnav .lbl{font-weight:650;font-size:17px;min-width:110px;max-width:calc(100vw - 210px);text-align:center;background:none;border:0;width:auto;height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px}
.htitle{font-weight:650;font-size:17px;padding:8px 0}
.hbtn{position:absolute;right:14px;top:50%;transform:translateY(-35%);border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;font-size:17px;line-height:1}
main{padding:2px 14px 130px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.card.list{padding:2px 14px;overflow:hidden}
.center{text-align:center}
.hero .k{color:var(--mute);font-size:14px;font-weight:600}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero.ok .big,.hero.ok .status{color:var(--vivid)}.hero.bad .big,.hero.bad .status{color:var(--bad)}
.status{font-size:13px;font-weight:600;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.stats div{font-size:11px;color:var(--mute)}.stats b{display:block;font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 4px 6px;display:flex;justify-content:space-between;font-weight:600}
h3 span{text-transform:none;letter-spacing:0}
.emo{width:36px;height:36px;border-radius:12px;background:var(--acc2);display:grid;place-items:center;font-size:17px;flex:none}
.cbody{flex:1;min-width:0;display:block}
.crow{display:flex;justify-content:space-between;gap:8px}
.cname{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);display:block}
p.sub{margin:6px 0}
.neg{color:var(--bad)}.pos{color:var(--vivid)}.mute{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.info{background:var(--acc2);color:var(--acc)}
.banner button{border:0;background:none;color:inherit;font-weight:650;text-decoration:underline;padding:0;margin-left:4px}
.fab{position:fixed;right:18px;bottom:86px;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--onacc);border:0;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 12px;font-size:12px;position:relative}
nav.tabs button.on{color:var(--acc);font-weight:650}
nav.tabs .ico{display:block;font-size:20px;margin-bottom:1px}
nav.tabs button.upd::after,nav.tabs button.dot::after{content:'';position:absolute;top:4px;left:calc(50% + 8px);width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{font-size:18px;margin:0;display:flex;align-items:center;min-width:0}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:15px;flex:none}
label.f{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.amt{font-size:30px;font-weight:700;text-align:center;padding:12px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:650;background:var(--acc);color:var(--onacc);margin-top:14px}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.tx{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;width:100%;background:none;text-align:left;min-width:0}
.amtv{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.plrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.plrow:last-child{border-bottom:0}
.plrow .tx{flex:1}
.plrow.todo .cname{color:var(--ink)}
.paybtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;white-space:nowrap;flex:none}
.paybtn.go{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.paybtn.done{border:0;background:none;color:var(--vivid);padding:8px 4px}
.dhead{font-size:12px;color:var(--mute);margin:16px 4px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead .chip{padding:4px 10px;font-size:12px;background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--badbg);color:var(--bad);margin-left:6px;vertical-align:1px}
.tag.g{background:var(--acc2);color:var(--ok)}.tag.n{background:var(--bg);color:var(--mute)}.tag.w{background:var(--warnbg);color:var(--warn)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.chk input{width:20px;height:20px;flex:none}
.itrow{display:grid;grid-template-columns:46px 1fr 100px 42px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.itrow .chk{grid-column:1/5;padding:0;font-size:13px;color:var(--mute)}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:44px;font-size:15px}
.ib.del{color:var(--bad)}
.ib.emobtn{font-size:22px;width:46px;flex:none;padding:0}
.epick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.epick button{font-size:24px;height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px}
.epick button.on{border-color:var(--acc);background:var(--acc2)}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.rrow:last-child{border-bottom:0}
.rrow.on .cname{color:var(--acc)}
.dlgwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.dlgwrap.open{display:flex}
.dlg{background:var(--card);border-radius:18px;padding:18px;max-width:380px;width:100%;max-height:85vh;overflow:auto}
.dlg p{margin:0 0 6px}
.dlg .btn{margin-top:8px}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}.toast.act{pointer-events:auto}
.toast button{margin-left:12px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:4px 2px}
@keyframes msl{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes msr{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}
#main.mslide-l{animation:msl .22s ease-out}#main.mslide-r{animation:msr .22s ease-out}
.hint{font-size:12px;color:var(--mute);margin-top:6px;display:block}
.hint.bad{color:var(--bad)}
.hidden{display:none!important}
.ubadge{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.ubadge.new{background:var(--bad);color:#fff}.ubadge.ok{background:var(--acc2);color:var(--ok)}.ubadge.chk{background:var(--line);color:var(--mute)}
details.help{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:0 14px}
details.help summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:'›';font-size:22px;color:var(--mute);transform:rotate(90deg);transition:transform .15s;line-height:1}
details.help[open] summary::after{transform:rotate(-90deg)}
details.help p,details.help ol,details.help ul{font-size:14px;margin:0 0 12px}
details.help ol,details.help ul{padding-left:20px}
details.help li{margin:4px 0}
/* wykres zestawienia – kolory z palety sprawdzonej pod kątem daltonizmu (osobne odcienie dla ciemnego motywu) */
:root{--c-zysk:#1baf7a;--c-kau:#6250d6;--c-pod:#eb6834;--c-kos:#2a78d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c-zysk:#199e70;--c-kau:#9085e9;--c-pod:#d95926;--c-kos:#3987e5}}
:root[data-theme=dark]{--c-zysk:#199e70;--c-kau:#9085e9;--c-pod:#d95926;--c-kos:#3987e5}
.chart .k{display:block;color:var(--mute);font-size:13px;font-weight:600}
.bigz{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.ynav{display:flex;gap:6px;align-self:flex-start}
.ynav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.sbar{display:flex;gap:2px;height:14px;margin:12px 0 8px}
.sbar i{display:block;min-width:3px;border-radius:4px}
.leg{display:grid;gap:2px}
.lrow{display:grid;grid-template-columns:14px 1fr auto 42px;gap:8px;align-items:center;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.lrow .sub{text-align:right}
.lrow:first-child{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.sw{width:12px;height:12px;border-radius:3px}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.col{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:110px;gap:4px;min-width:0}
.col .stk{display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden;min-height:0;border-bottom:1px solid var(--mute)}
.col .stk i{display:block;min-height:2px}
.col .ml{font-size:10px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden}
.col.dim .stk{opacity:.35}
.col.on .ml{color:var(--ink);font-weight:700}
.mdet{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:10px;font-variant-numeric:tabular-nums}
.mdet>b{width:100%}
.note{display:block;color:var(--ink);font-style:italic;margin-top:2px}
.msep{display:flex;align-items:center;gap:10px;margin:22px 2px 2px;color:var(--acc);font-size:13px;font-weight:700;letter-spacing:.02em}
.msep::before,.msep::after{content:'';flex:1;height:2px;background:var(--acc);opacity:.35;border-radius:1px}
.msep::before{flex:0 0 14px}
.dsep{display:flex;align-items:center;gap:10px;margin:26px 2px 6px;color:var(--c-kos);font-size:13px;font-weight:700;letter-spacing:.02em}
.dsep::before,.dsep::after{content:"";flex:1;height:2px;background:var(--c-kos);opacity:.55;border-radius:1px}
.dsep::before{flex:0 0 14px}
.dsep.end{margin:8px 2px 4px}
.dsep.end::before{display:none}
.osep{display:flex;align-items:center;gap:10px;margin:22px 2px 6px;color:var(--c-pod);font-size:13px;font-weight:700;letter-spacing:.02em}
.osep::before,.osep::after{content:"";flex:1;height:2px;background:var(--c-pod);opacity:.6;border-radius:1px}
.osep::before{flex:0 0 14px}
.osep.end{margin:10px 2px 4px}
.osep.end::before{display:none}
.card.ocard{border-color:color-mix(in srgb,var(--c-pod) 45%,var(--line))}
.card.dcard{border-color:color-mix(in srgb,var(--c-kos) 45%,var(--line))}
/* PIN */
.lock{position:fixed;inset:0;z-index:28;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lockbox{width:100%;max-width:310px;text-align:center}
.lockbox img{width:76px;height:76px;border-radius:18px}
.lockbox h2{margin:10px 0 4px;font-size:20px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 6px;min-height:18px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.lockmsg{min-height:20px;font-size:13px;color:var(--bad)}
.lockmsg.info{color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.pad button{height:68px;border-radius:18px;font-size:26px;background:var(--card);border:1px solid var(--line);user-select:none;-webkit-user-select:none;transition:transform .06s,background .06s}
.pad button.pr,.pad button:active{transform:scale(.93);background:var(--acc2)}
.pad button.ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.pad button.inv{visibility:hidden}
.linkbtn{border:0;background:none;color:var(--mute);margin-top:18px;text-decoration:underline;font-size:13px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
body.locked header,body.locked main,body.locked nav,body.locked #fab{visibility:hidden}
</style>
</head>
<body class="locked">
<header id="hdr"></header>
<main id="main"><div class="empty">Wczytywanie…</div></main>
<button class="fab" id="fab" data-act="add" aria-label="Dodaj" hidden>+</button>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="najem"><span class="ico">🏠</span>Najem</button>
  <button data-act="tab" data-tab="podatek" id="tab-tax"><span class="ico">🧾</span>Podatek</button>
  <button data-act="tab" data-tab="ustawienia" id="tab-ust"><span class="ico">⚙️</span>Ustawienia</button>
  <button data-act="tab" data-tab="pomoc" id="tab-help"><span class="ico">❓</span>Pomoc</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="lock" id="lock"><div class="lockbox" id="lockbox">
  <img src="house-192.png" alt="">
  <h2 id="lockTitle">Najem</h2>
  <div class="sub" id="lockSub"></div>
  <div class="dots" id="dots"></div>
  <div class="lockmsg" id="lockMsg"></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="Usuń cyfrę">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok" id="padOk" aria-label="Zatwierdź">✓</button>
  </div>
  <button class="linkbtn" id="lockForgot">Nie pamiętam PIN-u</button>
  <button class="linkbtn" id="lockCancel">Anuluj</button>
</div></div>
<div class="dlgwrap" id="dlg"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".html,.htm,.json,text/html,application/json" class="hidden">
<script id="report-data" type="application/json"></script>
<script>
"use strict";
/* Kopia czystej strony – z niej powstaje plik raportu. */
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const REPORT_TAG = '<script id="report-data" type="application/json"></' + 'script>';

const APP_VERSION = '1.16';
const APP_DATE = '2026-11-21';
/* Klucze pamięci – z przedrostkiem „najem-”, bo Budżet domowy działa pod tym samym adresem (github.io) i ma wspólną pamięć. */
const K = {data:'najem-v1', pin:'najem-pin', pinOff:'najem-pin-off', theme:'najem-theme', exp:'najem-lastExport', rid:'najem-rid'};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zl = g => { const v = Math.round(g || 0); const neg = v < 0; const a = Math.abs(v); const i = String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (neg ? '-' : '') + i + ',' + String(a % 100).padStart(2, '0') + ' zł'; };
const parseZl = s => {
  s = String(s ?? '').replace(/\s/g, '').replace(/zł/gi, '').replace(/,/g, '.').replace(/[−–]/g, '-'); if (s === '') return 0;
  if (!/^-?\d*\.?\d+([+-]\d*\.?\d+)*$/.test(s)) { const v = Number(s); return isFinite(v) ? Math.round(v * 100) : NaN; }
  return (s.match(/[+-]?\d*\.?\d+/g) || []).reduce((sum, p) => sum + Math.round(Number(p) * 100), 0);
};
const toInput = g => g ? (g / 100).toFixed(2).replace('.', ',') : '';
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const pad = n => String(n).padStart(2, '0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);

const verNewer = (a, b) => { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };

// ikony wybierane ręcznie: najem (r.icon), pozycja najmu (it.icon), pojedynczy wpis (c.icon); inaczej dobierane z nazwy

/* ---------- raport (tylko podgląd) ---------- */

/* ---------- stan ---------- */
const S = {tab:'najem', rid:(REPORT && REPORT.rid) || lsGet(K.rid), year:new Date().getFullYear(), sheet:null, remote:null, readOnly:!!REPORT, rd:null};
let store = null;

/* ---------- pamięć (tylko w telefonie) ----------
   rentals: {id, name, desc, tenant, from, to, dueDay, items:[{id,name,amount,taxable,from}], genFrom, skip:[], ts}
   charges: kind 'charge' (comiesięczna należność: r, m, item), 'extra' (jednorazowa należność: r, m, d), 'cost' (koszt: r, d)
            należność opłacona ma paidOn (data wpłaty) i opcjonalnie paid (wpłacona kwota, gdy inna niż należna)
   taxes:   'idNajmu|RRRR-MM' (miesiąc wpłat) → {payDate (kiedy chcę zapłacić), paidOn, paidAmount} */
function LocalStore(initial, persist) {
  const norm = d => {
    const settings = Object.assign({taxRate:8.5, taxDay:20}, d.settings || {});
    // do wersji 1.3 domyślna stawka była błędnie 8% – jednorazowo zamieniana na 8,5%
    if (!settings.rateFix) { if (Number(settings.taxRate) === 8) settings.taxRate = 8.5; settings.rateFix = 1; }
    // do wersji 1.12 opłaty liczyły się do zysku – jednorazowo: media bez podatku oznaczone jako „przekazuję dalej”
    if (!settings.passFix) {
      const util = n => { const s = normName(n); return ['oplat', 'prad', 'media', 'woda', 'wody', 'gaz', 'ogrzew', 'cieplo', 'smiec', 'czynsz adm', 'administr', 'wspolnot', 'spoldziel', 'energi'].some(k => s.includes(' ' + k)); };
      const passItems = new Set();
      for (const r of Object.values(d.rentals || {})) for (const it of r.items || []) if (!it.taxable && util(it.name)) { it.pass = true; passItems.add(it.id); }
      for (const c of Object.values(d.charges || {})) if ((c.kind === 'charge' && passItems.has(c.item)) || (c.kind === 'extra' && !c.taxable && !c.fromDep && util(c.name))) c.pass = true;

  };

  else { let raw = {}; try { const r = lsGet(K.data); if (r) raw = JSON.parse(r); } catch (e) {} data = norm(raw); }
  const subs = new Set(); let muted = false, dirty = false;
  const save = () => {
    if (muted) { dirty = true; return; }

    get: () => data,
    getAll: () => clone(data),

    replaceAll: d => { data = norm(d); save(); },
    saveSettings: s => { data.settings = s; save(); },

      save();
    },
    saveCharge: c => { data.charges[c.id] = c; save(); },
    deleteCharge: id => { delete data.charges[id]; save(); },
    saveTax: (k, v) => { data.taxes[k] = v; save(); },

}
const D = () => store.get();
function write(fn, okMsg) { try { fn(); if (okMsg) toast(okMsg); return true; } catch (e) { toast('Nie udało się zapisać.'); render(); return false; } }

/* ---------- dane pomocnicze ---------- */
const rentals = () => Object.values(D().rentals).sort((a, b) => (a.ts || 0) - (b.ts || 0));
const curR = () => { const l = rentals(); return l.find(r => r.id === S.rid) || l[0] || null; };
// strona „Wszystkie najmy” – za ostatnim najmem (gdy są co najmniej 2)
const ALL = '__all';
const showAll = () => S.rid === ALL && rentals().length > 1;
const navList = () => { const l = rentals().map(r => r.id); if (l.length > 1) l.push(ALL); return l; };
const setRid = id => { S.rid = id; if (!REPORT) lsSet(K.rid, id); };
const chargesOf = rid => Object.values(D().charges).filter(c => c.r === rid);
const isIncome = c => c.kind === 'charge' || c.kind === 'extra';
// kaucja: należna od najemcy, ale to nie przychód – trzymasz ją i oddajesz; przychodem jest tylko część zatrzymana przy rozliczeniu
const isDeposit = c => c.kind === 'deposit';
const isOwed = c => (isIncome(c) || isDeposit(c)) && !c.paidOn;
const depositOf = rid => chargesOf(rid).find(isDeposit);
const paidAmt = c => c.paid ?? c.amount;
const dueOf = c => { if (c.kind === 'extra' || c.kind === 'deposit') return c.d; const r = D().rentals[c.r] || {}; return clampDay(r.advance ? shiftMonth(c.m, -1) : c.m, r.dueDay || 10); };
// zaległe = termin minął przed początkiem bieżącego miesiąca
const isOldUnpaid = c => c.kind === 'charge' && !c.paidOn && dueOf(c) < curMonth() + '-01';
// ostatni miesiąc, za który są już należności: bieżący, a przy płatności z góry – także następny
const genEnd = r => { const cm = curMonth(), last = r.advance ? shiftMonth(cm, 1) : cm; return r.to && r.to.slice(0, 7) < last ? r.to.slice(0, 7) : last; };
const dueText = r => (r.advance ? 'płatne z góry, ' : 'płatne ') + ((r.dueDay || 10) >= 31 ? 'do końca ' : `do ${r.dueDay || 10}. dnia `) + (r.advance ? 'poprzedniego miesiąca' : 'miesiąca');
const shownDate = c => c.kind === 'cost' ? c.d : (c.paidOn || (c.kind === 'extra' || c.kind === 'deposit' ? c.d : c.m + '-01'));
const rentalEnded = r => r.to && r.to < todayStr();
const rentalPeriod = r => `od ${longDay(r.from)}` + (r.to ? ` do ${longDay(r.to)}` : ' · na czas nieokreślony');
// kwota pozycji w danym miesiącu: historia zmian czynszu (it.prices = [{from:'RRRR-MM', amount}]), inaczej it.amount
const amountFor = (it, m) => { let a = it.amount || 0; for (const p of it.prices || []) if (p.from <= m) a = p.amount; return a; };
const monthlyTotal = (r, m) => sum(r.items || [], it => amountFor(it, m || curMonth()));

/* ---------- comiesięczne należności: tworzą się same 1. dnia miesiąca ---------- */
// pierwszy miesiąc, od którego powstają należności (początek najmu albo późniejszy, jeśli tak wybrano)
const genStart = r => { const fm = r.from.slice(0, 7); return r.genFrom && r.genFrom > fm ? r.genFrom : fm; };
// należności usunięte ręcznie (nie odtwarzają się same) – tylko te, które dałoby się przywrócić
function skippedOf(r) {
  const s = genStart(r), e = genEnd(r);
  const items = new Map((r.items || []).filter(i => i.amount).map(i => [i.id, i]));
  return (r.skip || []).filter(k => { const [m, id] = k.split('|'); const it = items.get(id); return it && m >= s && m <= e && !(it.from && m < it.from); });
}
function restoreSkipped(rid) {
  const r = D().rentals[rid]; if (!r) return;
  const nr = clone(r), keep = new Set(skippedOf(r)); nr.skip = (r.skip || []).filter(k => !keep.has(k));
  store.saveRental(nr); const n = ensureCharges(); setRid(rid); render();
  toast(`Przywrócono ${n} ${plural(n, 'należność', 'należności', 'należności')}`);
}
const skippedLabel = r => { const ms = [...new Set(skippedOf(r).map(k => k.split('|')[0]))].sort(); return ms.length ? monthYear(ms[0]) + (ms.length > 1 ? ' – ' + monthYear(ms[ms.length - 1]) : '') : ''; };
function ensureCharges() {
  if (REPORT || !store) return 0;
  const d = D(), cm = curMonth(); let n = 0;
  const have = new Set(Object.values(d.charges).filter(c => c.kind === 'charge').map(c => c.r + '|' + c.m + '|' + c.item));
  store.batch(() => {
    for (const r of Object.values(d.rentals)) {
      const start = genStart(r);
      const end = genEnd(r);
      const skip = new Set(r.skip || []);
      for (let m = start; m <= end; m = shiftMonth(m, 1)) for (const it of r.items || []) {
        if (!amountFor(it, m) || (it.from && m < it.from)) continue;
        const k = r.id + '|' + m + '|' + it.id;
        if (have.has(k) || skip.has(m + '|' + it.id)) continue;
        store.saveCharge(Object.assign({id:uid(), kind:'charge', r:r.id, m, item:it.id, name:it.name, amount:amountFor(it, m), taxable:!!it.taxable, ts:Date.now()}, it.pass ? {pass:true} : {}));

/* ---------- podatek: ryczałt od wpłat z danego miesiąca, płatny w następnym (do 20.) ---------- */
const taxRate = () => { const v = Number(D().settings.taxRate); return isFinite(v) && v > 0 ? v : 8.5; };
const taxDay = () => Math.min(20, Math.max(1, Number(D().settings.taxDay) || 20));
const taxDeadline = m => clampDay(shiftMonth(m, 1), 20);
// dzień zapłaty podatku: własny w najmie (r.taxDay), inaczej wspólny z Ustawień; zawsze najpóźniej 20.
const taxDayFor = rid => { const v = Number((D().rentals[rid] || {}).taxDay); return v >= 1 && v <= 20 ? Math.round(v) : taxDay(); };
const taxDefault = (m, rid) => clampDay(shiftMonth(m, 1), rid ? taxDayFor(rid) : taxDay());
// Ordynacja podatkowa art. 63: podstawa i podatek zaokrąglane do pełnych złotych – końcówki poniżej 50 gr w dół, od 50 gr w górę.
// Liczone w groszach: zł × stawka% = grosze (np. 319 zł × 8 = 2552 gr = 25,52 zł → 26 zł).
const roundZl = gr => Math.floor((gr + 50) / 100 + 1e-9) * 100;
const taxOf = base => roundZl(roundZl(base) / 100 * taxRate());
const rateLabel = () => String(taxRate()).replace('.', ',') + '%';
const taxKey = (rid, m) => rid + '|' + m;
const taxPayments = (rid, m) => chargesOf(rid).filter(c => isIncome(c) && c.taxable && c.paidOn && c.paidOn.slice(0, 7) === m);
function taxEntries(rid) {
  const ms = new Set();
  for (const c of chargesOf(rid)) if (isIncome(c) && c.taxable && c.paidOn) ms.add(c.paidOn.slice(0, 7));
  for (const k of Object.keys(D().taxes)) { const i = k.lastIndexOf('|'); if (k.slice(0, i) === rid) ms.add(k.slice(i + 1)); }
  const out = [], cm = curMonth();
  for (const m of ms) {
    const rec = D().taxes[taxKey(rid, m)] || {};
    const pays = taxPayments(rid, m), base = sum(pays, paidAmt), calc = taxOf(base);
    const paid = !!rec.paidOn;
    const amount = paid ? (rec.paidAmount ?? calc) : calc;
    if (!amount && !paid) continue;
    out.push({rid, m, base, calc, amount, rec, paid, n:pays.length, open:m >= cm, date:rec.paidOn || rec.payDate || taxDefault(m, rid),
              late:!paid && todayStr() > taxDeadline(m), changed:paid && rec.paidAmount !== undefined && rec.paidAmount !== calc});
  }

}
const allTaxes = () => rentals().flatMap(r => taxEntries(r.id).map(x => Object.assign(x, {rname:r.name})));
const taxTodoAll = () => allTaxes().filter(x => !x.paid && !x.open);

/* ---------- render ---------- */

function backupBanner() {

  return `<div class="banner info">💾 ${days === null ? 'Nie masz jeszcze kopii danych.' : `Ostatnia kopia ${days} dni temu.`}<button data-act="report">Wyślij raport</button></div>`;
}

function onboardHtml() {

/* zakładka Podatek */
function taxTabHtml() {
  const y = String(S.year), all = allTaxes().filter(x => x.m.startsWith(y));
  const base = sum(all, x => x.base), tax = sum(all, x => x.amount), paid = sum(all.filter(x => x.paid), x => x.amount);
  let h = `<div class="card hero ${tax - paid ? '' : 'ok'}"><div class="k">Podatek za ${y} (${rateLabel()})</div><div class="big">${zl(tax)}</div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div>Przychód<b>${zl(base)}</b></div><div>Zapłacono<b class="pos">${zl(paid)}</b></div><div>Pozostało<b class="${tax - paid ? 'neg' : ''}">${zl(tax - paid)}</b></div></div></div>`;
  if (base > 10000000) h += `<div class="banner warn">Przychód z najmu w ${y} przekracza 100 000 zł – od nadwyżki ryczałt wynosi 12,5%. Stawkę zmienisz w Ustawieniach.</div>`;
  if (!all.length) return h + `<div class="empty">Brak wpłat w ${y}. Podatek pojawi się po oznaczeniu pierwszej wpłaty (💰 Wpłynęło).</div>`;
  const months = [...new Set(all.map(x => x.m))].sort().reverse();
  for (const m of months) {
    const list = all.filter(x => x.m === m), tot = sum(list, x => x.amount), todo = list.filter(x => !x.paid);
    const open = m >= curMonth(), late = todo.some(x => x.late);
    const status = !todo.length ? `<span class="pos">✓ zapłacony</span>` : open ? `naliczany – ${monthOnly(m)} trwa` : `<span class="neg">do zapłaty do ${shortDay(taxDeadline(m))}</span>${late ? '<span class="tag">po terminie</span>' : ''}`;
    h += `<h3>Za ${esc(monthYear(m))}<span>${zl(tot)}</span></h3><div class="card list">
      ${list.map(x => `<div class="plrow"><button class="tx" data-act="tax" data-r="${esc(x.rid)}" data-m="${m}"><span class="emo">${rIcon(D().rentals[x.rid])}</span><span class="cbody"><span class="crow"><span class="cname">${esc(x.rname)}</span><span class="amtv">${zl(x.amount)}</span></span><span class="sub">od ${zl(x.base)} · ${x.paid ? `zapłacono ${shortDay(x.rec.paidOn)}` : x.rec.payDate ? `planuję ${shortDay(x.rec.payDate)}` : `domyślnie ${shortDay(taxDefault(m, x.rid))}`}${x.changed ? '<span class="tag w">wpłaty się zmieniły</span>' : ''}</span></span></button>${x.paid ? '<span class="paybtn done">✓</span>' : ''}</div>`).join('')}
      <div class="kv"><span class="sub" style="font-size:13px">${status}</span>${todo.length && !open && !S.readOnly ? `<button class="paybtn go" data-act="taxpaidm" data-m="${m}">✓ Zapłacone</button>` : ''}</div></div>`;
  }
  return h;
}

  <details class="help"><summary>📊 Zestawienie roku</summary>
    <p>Pod podatkami jest wykres roku: „Zostaje u mnie” (zysk + kaucja do zwrotu, kaucja jako osobna pozycja), pasek pokazujący, jak wpłaty dzielą się na zysk, podatek i koszty, oraz słupki dla każdego miesiąca. Stuknij miesiąc, żeby zobaczyć jego kwoty; strzałkami ‹ › zmienisz rok.</p></details>
  <details class="help"><summary>🔐 Kaucja</summary>
    <ul><li>Kwotę kaucji wpisz w edycji najmu (✏️ edytuj → „Kaucja zwrotna”). Pojawi się w „Najemca ma zapłacić” z terminem w dniu początku najmu.</li>
    <li>Kaucja nie jest przychodem: nie liczy się do podatku, „Wpłynęło” ani zysku. Gdy wpłynie, jest w karcie <b>Kaucja u mnie</b>.</li>
    <li>Na koniec najmu stuknij <b>Rozlicz i zwróć</b>: dopisz potrącenia (np. uszkodzona podłoga 500 zł), datę zwrotu – aplikacja policzy, ile oddać. Zwrot pojawi się w Historii.</li>
    <li>Zatrzymana część zapisuje się z datą zwrotu – domyślnie bez podatku (można zaznaczyć, jeśli księgowa uzna ją za przychód). Jeśli szkody są większe niż kaucja, różnica pojawi się jako dopłata do zapłaty przez najemcę. Koszty naprawy dodaj osobno jako koszt.</li>

  <details class="help"><summary>🔧 Koszty</summary>
    <p>Koszty (naprawy, wyposażenie, ubezpieczenie, czynsz do wspólnoty) dodajesz przyciskiem <b>+</b>. Przy ryczałcie nie zmniejszają podatku – służą do policzenia, ile naprawdę zostaje z najmu („Zostaje” na górze).</p></details>
  <details class="help"><summary>🎨 Ikony</summary>
    <p>Ikony dobierają się same według nazwy. Możesz je zmienić: <b>ikonę najmu</b> i <b>ikonę każdej pozycji</b> (Czynsz, Opłaty, Prąd…) w edycji najmu – przycisk z ikoną obok nazwy; ikona pozycji przechodzi na wszystkie jej należności i wpłaty. <b>Ikonę pojedynczego wpisu</b> (np. kosztu) zmienisz w okienku po stuknięciu wpisu. „Automatycznie” przywraca ikonę według nazwy.</p></details>
  <details class="help"><summary>💾 Kopia danych i Excel</summary>
    <p>Dane są tylko w tym telefonie. Odinstalowanie aplikacji lub wyczyszczenie danych Chrome może je usunąć – regularnie wysyłaj raport (Ustawienia → Wyślij raport). To jeden plik HTML: na komputerze otworzysz go jako podgląd, a w telefonie wczytasz przyciskiem „Wczytaj z pliku”.</p>
    <p>Eksport do Excela zawiera wpłaty, podatki, koszty i nieopłacone należności ze wszystkich najmów.</p></details>`;
}
function updateHtml() {
  const r = S.remote; let info;
  if (REPORT) return `<p class="sub">Wersja ${APP_VERSION}</p>`;
  if (!r) info = `<p class="sub">Sprawdzam najnowszą wersję…</p>`;
  else if (r.error) info = `<p class="sub">Nie udało się sprawdzić – brak internetu?</p><button class="btn sec" data-act="updcheck">🔄 Sprawdź ponownie</button>`;
  else if (verNewer(r.version, APP_VERSION)) info = `<div class="kv"><span>Najnowsza</span><b class="pos">${esc(r.version)} (${esc(fmtDate(r.date))})</b></div>
      ${(r.changes || []).length ? `<p class="sub"><b>Co nowego:</b><br>${r.changes.map(c => '• ' + esc(c)).join('<br>')}</p>` : ''}
      <button class="btn" data-act="update">⬇️ Aktualizuj do ${esc(r.version)}</button><span class="hint">Twoje dane zostaną bez zmian.</span>`;
  else info = `<div class="kv"><span>Najnowsza</span><b>${esc(r.version)}</b></div><p class="sub">✓ Masz aktualną wersję.</p><button class="btn sec" data-act="updcheck">🔄 Sprawdź ponownie</button>`;
  return `<div class="kv"><span>Twoja wersja</span><b>${APP_VERSION} (${esc(fmtDate(APP_DATE))})</b></div>${info}`;
}
async function checkUpdate() {
  if (REPORT) return;
  if (!S.remote || S.remote.error) { S.remote = null; if (S.tab === 'pomoc') renderMain(true); }
  try { const res = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!res.ok) throw new Error(res.status); S.remote = await res.json(); }
  catch (e) { S.remote = {error:true}; }
  render(); if (S.tab === 'pomoc') renderMain(true);
}
async function doUpdate() {
  toast('Aktualizuję…');
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    if (window.caches) await Promise.all((await caches.keys()).filter(k => k.startsWith('najem-')).map(k => caches.delete(k)));
  } catch (e) {}
  setTimeout(() => location.reload(), 300);
}

function openSheet(html, ctx) { S.sheet = ctx || {}; $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#ov').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#ov').classList.remove('open'); $('#sheet').innerHTML = ''; S.sheet = null; S.rd = null; S.dep = null; document.body.style.overflow = ''; if (pending) renderMain(); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
const head = t => `<div class="shead"><h2>${t}</h2><button class="x" data-act="close" aria-label="Zamknij">✕</button></div>`;
function choose(text, options) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="dlg"><p>${esc(text)}</p>${options.map((o, i) => `<button class="btn ${o.cls || ''}" data-r="${i}">${esc(o.label)}</button>`).join('')}<button class="btn sec" data-r="-1">Anuluj</button></div>`;

    d.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return; d.classList.remove('open'); d.onclick = null; res(b ? Number(b.dataset.r) : -1); };

function iconPicked(v) {
  const x = S.sheet && S.sheet.iconCtx; if (!x) return;
  const set = (o, k) => { if (v) o[k] = v; else delete o[k]; };
  if (x.for === 'rental' || x.for === 'item') {
    if (v !== '__back' && S.rd) set(x.for === 'rental' ? S.rd : S.rd.items[x.i], 'icon');
    renderRentalSheet(); return;
  }
  const c = D().charges[x.id]; if (!c) { closeSheet(); return; }
  if (v !== '__back') { const n = clone(c); set(n, 'icon'); store.saveCharge(n); }
  if (x.for === 'cost') openCost(x.id); else openCharge(x.id);
}
/* wybór miesiąca z listy → 'RRRR-MM' albo undefined (Anuluj) */
function askMonth(text, months, def, first) {

async function saveRental() {
  syncRd(); const d = clone(S.rd), cm = curMonth();
  d.name = d.name.trim(); d.desc = d.desc.trim(); d.tenant = d.tenant.trim();
  if (!d.name) { toast('Wpisz nazwę najmu'); return; }
  if (!isDate(d.from)) { toast('Wpisz datę początku najmu'); return; }
  if (d.to && !isDate(d.to)) d.to = '';
  if (d.to && d.to < d.from) { toast('Data końca jest przed datą początku'); return; }
  d.dueDay = Math.min(31, Math.max(1, Number(d.dueDay) || 10)); d.advance = !!Number(d.advance);
  if (String(d.taxDay ?? '').trim() === '') delete d.taxDay; else { const td = Number(d.taxDay); if (!(td >= 1 && td <= 20)) { toast('Dzień zapłaty podatku: od 1 do 20'); return; } d.taxDay = Math.round(td); }
  const items = [];
  for (const it of d.items) {
    const a = it.amountTxt !== undefined ? parseZl(it.amountTxt) : it.amount;
    if (isNaN(a) || a < 0) { toast('Popraw kwotę: ' + (it.name || 'pozycja')); return; }
    it.name = (it.name || '').trim(); delete it.amountTxt; it.amount = a;
    if (!it.name && !a) continue;
    if (!it.name) { toast('Wpisz nazwę pozycji'); return; }
    items.push(it);
  }
  d.items = items;
  const depAmt = d.depTxt !== undefined ? parseZl(d.depTxt) : null; delete d.depTxt;
  if (depAmt !== null && (isNaN(depAmt) || depAmt < 0)) { toast('Popraw kwotę kaucji'); return; }
  const old = D().rentals[d.id], isNew = !old; delete d.isNew;
  const amtUpd = [];
  if (isNew) {
    d.ts = Date.now(); const fm = d.from.slice(0, 7);
    if (fm < cm) {
      const n = monthDiff(fm, cm) + 1;
      const ch = await choose(`Najem trwa od ${monthLabel(fm)}. Od kiedy dodać comiesięczne należności?`, [{label:`Od początku najmu (${n} ${plural(n, 'miesiąc', 'miesiące', 'miesięcy')})`}, {label:`Od bieżącego miesiąca (${monthLabel(cm)})`}]);
      if (ch < 0) return;
      d.genFrom = ch === 0 ? fm : cm;
    } else d.genFrom = fm;
  } else {
    // data „Od” przesunięta wcześniej → zapytaj o należności za wcześniejsze miesiące
    const fm = d.from.slice(0, 7), oldStart = genStart(old);
    if (fm < old.from.slice(0, 7) && fm < oldStart && fm <= cm) {
      const to = shiftMonth(oldStart, -1), n = monthDiff(fm, oldStart);
      const ch = await choose(`Dodać należności za wcześniejsze miesiące: ${monthLabel(fm)}${n > 1 ? ' – ' + monthLabel(to) : ''} (${n} ${plural(n, 'miesiąc', 'miesiące', 'miesięcy')})?`, [{label:'Tak, dodaj'}, {label:'Nie, tylko zmień datę', cls:'sec'}]);
      if (ch < 0) return;
      if (ch === 0) { d.genFrom = fm; for (const it of d.items) if (it.from && it.from <= oldStart) delete it.from; }
    }
    const startM = d.genFrom || d.from.slice(0, 7);
    for (const it of d.items) if (!old.items.some(o => o.id === it.id) && cm > startM) it.from = cm;
    // zmiana kwoty (np. podwyżka czynszu) – od wybranego miesiąca; opłacone wpłaty zostają bez zmian
    const amtCh = d.items.map(it => [it, old.items.find(x => x.id === it.id)]).filter(([it, o]) => o && o.amount && o.amount !== it.amount);

    if (amtCh.length) {
      const desc = amtCh.map(([it, o]) => `${it.name}: ${zl(o.amount)} → ${zl(it.amount)}`).join(', ');
      // dowolny miesiąc: od początku najmu do roku naprzód (także historyczne dane)
      const first = d.from.slice(0, 7), months = [];
      for (let m = first; m <= shiftMonth(cm, 12); m = shiftMonth(m, 1)) months.push(m);
      const from = await askMonth(`Od którego miesiąca nowa kwota? (${desc})`, months, cm <= months[months.length - 1] ? cm : months[0], first);
      if (from === undefined) return;
      for (const [it, o] of amtCh) {
        if (from > first) { const hist = (o.prices && o.prices.length ? o.prices : [{from:'0000-00', amount:o.amount || 0}]).filter(p => p.from < from); it.prices = hist.concat([{from, amount:it.amount}]); }
        else delete it.prices;
      }
      const ids = new Set(amtCh.map(([it]) => it.id));
      const inRange = chargesOf(d.id).filter(c => c.kind === 'charge' && ids.has(c.item) && c.m >= from);
      const newAmt = c => d.items.find(it => it.id === c.item).amount;
      for (const c of inRange) if (!c.paidOn && c.amount !== newAmt(c)) amtUpd.push([c, newAmt(c)]);
      // wpłaty od tego miesiąca zapisane ze starą kwotą (np. przy wpisywaniu historii)
      const paidOld = inRange.filter(c => c.paidOn && c.amount !== newAmt(c));
      if (paidOld.length) {
        const ch = await choose(`Od ${monthYear(from)} jest ${paidOld.length} ${plural(paidOld.length, 'wpłata zapisana', 'wpłaty zapisane', 'wpłat zapisanych')} ze starą kwotą. Zmienić je też na nową kwotę? Podatek się przeliczy.`,
          [{label:'Tak, popraw też zapisane wpłaty'}, {label:'Nie, zostaw wpłaty bez zmian', cls:'sec'}]);
        if (ch < 0) return;
        if (ch === 0) for (const c of paidOld) amtUpd.push([c, newAmt(c), true]);
      }

    }
    // zmiany nazw / podatku w nieopłaconych należnościach
    const upd = [];
    for (const it of d.items) {
      const o = old.items.find(x => x.id === it.id); if (!o || (o.name === it.name && !!o.taxable === !!it.taxable)) continue;
      for (const c of chargesOf(d.id)) if (c.kind === 'charge' && c.item === it.id && !c.paidOn && (c.name !== it.name || c.taxable !== !!it.taxable)) upd.push([c, it]);
    }
    if (upd.length) {
      const ch = await choose(`Zmienić nazwę / podatek też w nieopłaconych należnościach (${upd.length})?`, [{label:'Tak, zmień też nieopłacone'}, {label:'Nie, tylko kolejne miesiące', cls:'sec'}]);
      if (ch < 0) return;
      if (ch === 0) store.batch(() => { for (const [c, it] of upd) store.saveCharge(Object.assign(clone(D().charges[c.id] || c), {name:it.name, taxable:!!it.taxable})); });
    }
    // zmiana „liczyć do podatku” – także we wpłatach już zapisanych (podatek się przeliczy)
    const taxUpd = [];
    for (const it of d.items) {
      const o = old.items.find(x => x.id === it.id); if (!o || !!o.taxable === !!it.taxable) continue;
      for (const c of chargesOf(d.id)) if (c.kind === 'charge' && c.item === it.id && c.paidOn && !!c.taxable !== !!it.taxable) taxUpd.push([c, it]);
    }
    if (taxUpd.length) {
      const names = [...new Set(taxUpd.map(([, it]) => it.name))].join(', ');
      const ch = await choose(`„${names}” – ${taxUpd[0][1].taxable ? 'liczyć do podatku' : 'nie liczyć do podatku'} także we wpłatach już zapisanych (${taxUpd.length})? Podatek za te miesiące się przeliczy.`, [{label:'Tak, także we wpłatach'}, {label:'Nie, tylko od teraz', cls:'sec'}]);
      if (ch < 0) return;
      if (ch === 0) store.batch(() => { for (const [c, it] of taxUpd) store.saveCharge(Object.assign(clone(c), {taxable:!!it.taxable})); });
    }
  }
  if (!write(() => store.batch(() => {
    store.saveRental(d);
    for (const [c, a] of amtUpd) store.saveCharge(Object.assign(clone(D().charges[c.id] || c), {amount:a}));
    // „przekazuję dalej” zmienione w pozycji – we wszystkich jej należnościach (wpływa tylko na zysk, nie na podatek)
    if (!isNew) for (const it of d.items) { const o = old.items.find(x => x.id === it.id); if (o && !!o.pass !== !!it.pass) for (const c of chargesOf(d.id)) if (c.kind === 'charge' && c.item === it.id) { const n = clone(D().charges[c.id]); if (it.pass) n.pass = true; else delete n.pass; store.saveCharge(n); } }
    // kaucja: dopóki nie wpłynęła, zmienia się razem z najmem
    const dp = depositOf(d.id);
    if (depAmt === null || (dp && dp.paidOn)) return;
    if (depAmt > 0 && !dp) store.saveCharge({id:uid(), kind:'deposit', r:d.id, name:'Kaucja', amount:depAmt, d:d.from, m:d.from.slice(0, 7), ts:Date.now()});
    else if (dp && !depAmt) store.deleteCharge(dp.id);
    else if (dp && (dp.amount !== depAmt || dp.d !== d.from)) store.saveCharge(Object.assign(clone(dp), {amount:depAmt, d:d.from, m:d.from.slice(0, 7)}));
  }))) return;
  setRid(d.id); closeSheet(); const n = ensureCharges();
  if (isNew) S.tab = 'najem';
  const nTxt = n ? ` · dodano ${n} ${plural(n, 'należność', 'należności', 'należności')}` : '';
  toast((isNew ? 'Najem dodany' : 'Zapisano') + nTxt);
  render();
}

function syncDep() {
  if (!S.dep || !$('#dep-date')) return;

function depCalc() {
  const c = D().charges[S.dep.id], total = paidAmt(c);
  const ded = sum(S.dep.ded, x => { const v = parseZl(x.amtTxt); return isNaN(v) ? 0 : v; });

function saveDeposit() {
  syncDep(); const d = S.dep, c = D().charges[d.id];
  if (!isDate(d.date)) { toast('Wpisz datę zwrotu'); return; }
  const ded = [];
  for (const x of d.ded) {

    ded.push({name:name || 'potrącenie', amount:a});
  }
  const k = depCalc(), names = ded.map(x => x.name).join(', ');
  const linked = chargesOf(c.r).filter(x => x.fromDep === c.id);
  store.batch(() => {
    linked.forEach(x => store.deleteCharge(x.id));
    store.saveCharge(Object.assign(clone(c), {retOn:d.date, ret:k.ret, ded, retTax:d.tax}));
    const base = {r:c.r, d:d.date, m:d.date.slice(0, 7), taxable:d.tax, fromDep:c.id, ts:Date.now()};

  toast(`Kaucja rozliczona: zwrot ${zl(k.ret)}${k.kept ? `, zatrzymane ${zl(k.kept)}` : ''}`, () => store.batch(() => { chargesOf(c.r).filter(x => x.fromDep === c.id).forEach(x => store.deleteCharge(x.id)); store.saveCharge(c); linked.forEach(x => store.saveCharge(x)); }));

/* ---------- raport / excel / import ---------- */
async function shareOrDownload(blob, name, title) {
  const file = new File([blob], name, {type:blob.type});
  if (navigator.canShare && navigator.share) {
    try { if (navigator.canShare({files:[file]})) { await navigator.share({files:[file], title, text:title}); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return 'downloaded';
}
function buildReport() {
  const payload = Object.assign(store.getAll(), {exportedAt:new Date().toISOString(), rid:S.rid, app:'najem', v:1});
  const json = JSON.stringify(payload).replace(/</g, '\\u003c');
  if (PRISTINE.indexOf(REPORT_TAG) < 0) throw new Error('template');
  return PRISTINE.replace(REPORT_TAG, '<script id="report-data" type="application/json">' + json + '</' + 'script>');
}
async function sendReport() {
  let html; try { html = buildReport(); } catch (e) { toast('Nie udało się przygotować raportu'); return; }
  const r = await shareOrDownload(new Blob([html], {type:'text/html'}), 'najem-raport-' + todayStr() + '.html', 'Najem – raport ' + todayStr());
  if (r === 'cancel') return;
  lsSet(K.exp, String(Date.now()));
  toast(r === 'shared' ? 'Raport gotowy do wysłania' : 'Raport zapisany w Pobranych');
  render(); if (S.tab === 'ustawienia') renderMain(true);
}

/* ---------- PIN ---------- */
const L = {mode:null, step:0, buf:'', first:'', fails:0, until:0, busy:false, onOk:null, info:''};
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pinSupported = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
function pinRec() { try { return JSON.parse(lsGet(K.pin) || 'null'); } catch (e) { return null; } }
async function pinHash(pin, salt, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64d(salt), iterations:iter, hash:'SHA-256'}, k, 256));
}
async function pinSave(pin) { const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000; localStorage.setItem(K.pin, JSON.stringify({salt, iter, hash:await pinHash(pin, salt, iter), len:pin.length})); }
async function pinCheck(pin) { const r = pinRec(); return !!r && (await pinHash(pin, r.salt, r.iter)) === r.hash; }
const lockVerifying = () => L.mode === 'unlock' || L.mode === 'confirm' || (L.mode === 'change' && L.step === 0);
const lockNewStep = () => (L.mode === 'setup' && L.step === 0) || (L.mode === 'change' && L.step === 1);
function lockOpen(mode, opts) {
  L.mode = mode; L.step = 0; L.buf = ''; L.first = '';
  L.onOk = (opts && opts.onOk) || null; L.info = (opts && opts.info) || ''; L.cancellable = !!(opts && opts.cancellable); L.firstRun = !!(opts && opts.firstRun);
  closeSheet(); $('#dlg').classList.remove('open');
  document.body.classList.add('locked'); $('#lock').classList.remove('hidden'); lockDraw();
}
function lockClose() { L.mode = null; document.body.classList.remove('locked'); $('#lock').classList.add('hidden'); render(); }
function lockDraw(msg) {
  const m = L.mode, s = L.step;
  const [title, sub] = m === 'unlock' ? ['Wpisz PIN', ''] : m === 'confirm' ? ['Potwierdź PIN-em', L.info]
    : m === 'setup' ? (s === 0 ? ['Ustaw PIN', '4–6 cyfr. Będzie potrzebny przy każdym otwarciu aplikacji.'] : ['Powtórz PIN', ''])
    : (s === 0 ? ['Obecny PIN', ''] : s === 1 ? ['Nowy PIN', '4–6 cyfr'] : ['Powtórz nowy PIN', '']);
  $('#lockTitle').textContent = title; $('#lockSub').textContent = sub;
  const n = lockVerifying() ? (pinRec()?.len || 4) : (L.step === (m === 'setup' ? 1 : 2) ? L.first.length : Math.max(4, L.buf.length));
  $('#dots').innerHTML = Array.from({length:n}, (_, i) => `<i class="${i < L.buf.length ? 'f' : ''}"></i>`).join('');
  $('#lockMsg').textContent = msg || '';
  $('#padOk').classList.toggle('inv', !lockNewStep());
  $('#lockForgot').classList.toggle('hidden', m !== 'unlock');
  $('#lockCancel').classList.toggle('hidden', m !== 'change' && m !== 'confirm' && !L.cancellable);
  $('#lockCancel').textContent = (m === 'setup' && L.firstRun) ? 'Bez PIN-u' : 'Anuluj';
}
function lockShake() { const b = $('#lockbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
async function lockKey(k) {
  if (!L.mode || L.busy) return;
  if (Date.now() < L.until) { lockDraw(`Za dużo prób. Spróbuj za ${Math.ceil((L.until - Date.now()) / 1000)} s`); return; }
  if (k === 'del') { L.buf = L.buf.slice(0, -1); lockDraw(); return; }
  if (k === 'ok') { if (lockNewStep()) await lockSubmit(); return; }
  const target = lockVerifying() ? (pinRec()?.len || 4) : lockNewStep() ? 0 : L.first.length;
  if (L.buf.length >= (target || 6)) return;
  L.buf += k; lockDraw();
  if (target && L.buf.length === target) { L.busy = true; setTimeout(() => { L.busy = false; lockSubmit(); }, 100); }
}
async function lockSubmit() {
  const pin = L.buf;
  if (lockVerifying()) {
    L.busy = true; const m = $('#lockMsg'); m.textContent = 'Sprawdzam…'; m.classList.add('info');
    const ok = await pinCheck(pin); L.busy = false; m.classList.remove('info');
    if (!ok) { L.buf = ''; if (++L.fails >= 5) { L.until = Date.now() + 30000; L.fails = 0; } lockShake(); lockDraw('Błędny PIN'); return; }
    L.fails = 0;
    if (L.mode === 'unlock') { lockClose(); return; }
    if (L.mode === 'confirm') { const cb = L.onOk; lockClose(); if (cb) cb(); return; }
    L.step = 1; L.buf = ''; lockDraw(); return;
  }
  if (lockNewStep()) {
    if (pin.length < 4) { lockShake(); lockDraw('PIN musi mieć 4–6 cyfr'); return; }
    L.first = pin; L.step++; L.buf = ''; lockDraw(); return;
  }
  if (pin !== L.first) { L.step--; L.buf = ''; L.first = ''; lockShake(); lockDraw('PIN-y się różnią – spróbuj jeszcze raz'); return; }
  L.busy = true;
  try { await pinSave(pin); } catch (e) { L.busy = false; lockDraw('Nie udało się zapisać PIN-u'); return; }
  L.busy = false;
  const change = L.mode === 'change'; L.cancellable = false; lsDel(K.pinOff);
  lockClose(); toast(change ? 'PIN zmieniony' : 'PIN ustawiony'); if (S.tab === 'ustawienia') renderMain(true);
}
$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  e.preventDefault(); b.classList.add('pr'); setTimeout(() => b.classList.remove('pr'), 110);
  try { navigator.vibrate && navigator.vibrate(8); } catch (_) {}
  lockKey(b.dataset.k);
});
$('#pad').addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (!L.mode) return; if (/^[0-9]$/.test(e.key)) lockKey(e.key); else if (e.key === 'Backspace') lockKey('del'); else if (e.key === 'Enter') lockKey('ok'); });
$('#lockCancel').addEventListener('click', () => {
  if (L.mode === 'setup' && L.cancellable && !pinRec()) lsSet(K.pinOff, '1');
  if (L.mode === 'change' || L.mode === 'confirm' || L.cancellable) { L.cancellable = false; lockClose(); }
});
$('#lockForgot').addEventListener('click', async () => {
  if (!(await ask('Bez PIN-u nie da się odblokować aplikacji. Możesz usunąć wszystkie dane Najmu z tego telefonu, ustawić nowy PIN i wczytać ostatni raport. Usunąć dane?', 'Usuń dane'))) return;
  if (!(await ask('Na pewno? Tego nie można cofnąć.', 'Tak, usuń wszystko'))) return;
  Object.values(K).forEach(lsDel);
  location.reload();
});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (REPORT || !pinRec()) return;
  if (document.hidden) hiddenAt = Date.now();
  else if (!L.mode && hiddenAt && Date.now() - hiddenAt > 60000) lockOpen('unlock');
});

/* ---------- przełączanie najmów przeciągnięciem po karcie podsumowania ---------- */
function stepRental(dir) {
  const l = navList(); if (l.length < 2) return;
  const i = Math.max(0, l.indexOf(showAll() ? ALL : curR().id));
  setRid(l[(i + dir + l.length) % l.length]); window.scrollTo(0, 0); render();
  const m = $('#main'); m.classList.remove('mslide-l', 'mslide-r'); void m.offsetWidth; m.classList.add(dir > 0 ? 'mslide-l' : 'mslide-r');
}
let MS = null, MS_T = 0;
document.addEventListener('touchstart', e => {
  MS = null; if (S.sheet || e.touches.length !== 1 || S.tab !== 'najem') return;
  if (!e.target.closest('.hero')) return;
  const t = e.touches[0]; MS = {x:t.clientX, y:t.clientY};
}, {passive:true});
document.addEventListener('touchend', e => {
  if (!MS) return; const t = e.changedTouches[0], dx = t.clientX - MS.x, dy = t.clientY - MS.y; MS = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  MS_T = Date.now(); stepRental(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------- akcje ---------- */
const RO_OK = ['close', 'tab', 'rprev', 'rnext', 'rpick', 'rset', 'yprev', 'ynext', 'ynow', 'cyprev', 'cynext', 'cmsel', 'theme', 'redit', 'charge', 'cost', 'tax', 'depset'];
document.addEventListener('click', async e => {
  if (Date.now() - MS_T < 400) return;
  const el = e.target.closest('[data-act]'); if (!el || L.mode) return;
  const a = el.dataset.act, ds = el.dataset;
  if (S.readOnly && !RO_OK.includes(a)) return;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'tab': S.tab = ds.tab; window.scrollTo(0, 0); render(); if (ds.tab === 'pomoc') checkUpdate(); break;
    case 'rprev': stepRental(-1); break;
    case 'rnext': stepRental(1); break;
    case 'rpick': openPick(); break;
    case 'rset': setRid(ds.id); closeSheet(); S.tab = 'najem'; window.scrollTo(0, 0); render(); break;
    case 'yprev': S.year--; render(); break;
    case 'ynext': S.year++; render(); break;
    case 'ynow': S.year = new Date().getFullYear(); render(); break;
    case 'cyprev': case 'cynext': S.cy = (S.cy || new Date().getFullYear()) + (a === 'cyprev' ? -1 : 1); S.cm = null; render(); break;
    case 'cmsel': S.cm = S.cm === ds.m ? null : ds.m; render(); break;
    case 'theme': lsSet(K.theme, isDarkNow() ? 'light' : 'dark'); applyTheme(); render(); if (S.tab === 'ustawienia') renderMain(true); break;
    case 'updcheck': checkUpdate(); break;
    case 'update': doUpdate(); break;
    case 'report': sendReport(); break;
    case 'xlsx': exportXlsx(); break;
    case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
    case 'pinchange': lockOpen('change'); break;
    case 'pinoff': lockOpen('confirm', {info:'Wyłączenie PIN-u', onOk:() => { lsDel(K.pin); lsSet(K.pinOff, '1'); toast('PIN wyłączony'); renderMain(true); }}); break;
    case 'pinon': lockOpen('setup', {cancellable:true}); break;
    case 'setsave': {
      const rate = Number(String($('#set-rate').value).replace(',', '.')), day = Number($('#set-day').value);
      if (!(rate > 0 && rate < 100)) { toast('Popraw stawkę podatku'); return; }
      if (!(day >= 1 && day <= 20)) { toast('Dzień zapłaty: od 1 do 20'); return; }
      write(() => store.saveSettings(Object.assign(clone(D().settings), {taxRate:rate, taxDay:Math.round(day)})), 'Zapisano'); renderMain(true); break;
    }

    case 'add': {
      const r = curR(), fm = r.from.slice(0, 7), gs = genStart(r), nb = gs > fm && fm <= curMonth() ? monthDiff(fm, gs) : 0;
      openSheet(head('Dodaj') + `<button class="btn" data-act="redit" data-id="${esc(r.id)}">💵 Czynsz i opłaty – kwoty co miesiąc</button><span class="hint">ile najemca płaci co miesiąc; zmiana kwot i okresu najmu</span>
        ${nb ? `<button class="btn" data-act="rbackfill" data-id="${esc(r.id)}">📅 Należności za wcześniejsze miesiące (od ${esc(monthYear(fm))})</button>` : ''}
        ${skippedOf(r).length ? `<button class="btn" data-act="rrestore" data-id="${esc(r.id)}">↩️ Przywróć usunięte należności (${skippedOf(r).length})</button><span class="hint">${esc(skippedLabel(r))} – z obecnymi kwotami z najmu</span>` : ''}
        <button class="btn sec" data-act="addcost">🔧 Koszt</button>
        <button class="btn sec" data-act="addextra">💵 Jednorazowa należność</button><span class="hint">np. dopłata za media, kaucja, odsetki za zwłokę</span>
        <button class="btn sec" data-act="addrental">🏠 Nowy najem</button>`);
      break;
    }
    case 'addcost': openCost(null); break;
    case 'addextra': openExtra(); break;
    case 'addrental': openRental(null); break;
    case 'pickr': S.sheet.r = ds.id; document.querySelectorAll('#rchips .chip').forEach(b => b.classList.toggle('on', b.dataset.id === ds.id)); break;

    /* najem */
    case 'redit': openRental(ds.id); break;
    case 'itadd': syncRd(); S.rd.items.push({id:uid(), name:'', amount:0, taxable:true}); renderRentalSheet(); { const r = document.querySelectorAll('.itn'); r[r.length - 1]?.focus(); } break;
    case 'itdel': syncRd(); S.rd.items.splice(+ds.i, 1); renderRentalSheet(); break;
    case 'rsave': await saveRental(); break;
    case 'rrestore': closeSheet(); restoreSkipped(ds.id); break;
    case 'rbackfill': {
      const r = D().rentals[ds.id || (S.rd && S.rd.id)]; if (!r) return;
      const gs = genStart(r), nr = clone(r); nr.genFrom = r.from.slice(0, 7);
      for (const it of nr.items) if (it.from && it.from <= gs) delete it.from;
      store.saveRental(nr); const n = ensureCharges(); closeSheet(); setRid(r.id); render();
      toast(`Dodano ${n} ${plural(n, 'należność', 'należności', 'należności')} za wcześniejsze miesiące`);
      break;
    }
    case 'rpayold': case 'payold': {
      const rid = a === 'rpayold' ? S.rd.id : curR().id, n = chargesOf(rid).filter(isOldUnpaid).length;
      if (!(await ask(`Oznaczyć ${n} ${plural(n, 'należność', 'należności', 'należności')} z poprzednich miesięcy jako wpłacone w dniu terminu?`, 'Oznacz', false))) return;
      closeSheet(); payOld(rid);
      break;
    }
    case 'rdel': {
      const r = D().rentals[S.rd.id]; if (!r) return;
      const n = chargesOf(r.id).length;
      if (!(await ask(`Usunąć najem „${r.name}” razem ze wszystkimi wpisami (${n}) i podatkami? Tego nie da się cofnąć.`, 'Usuń najem'))) return;
      const run = () => { store.deleteRental(r.id); closeSheet(); setRid(rentals()[0]?.id || ''); toast('Najem usunięty'); render(); };
      if (pinSupported() && pinRec()) lockOpen('confirm', {info:'Usunięcie najmu: ' + r.name, onOk:run}); else run();
      break;
    }

    /* należności */
    case 'iconpick': {
      if (ds.for === 'rental' || ds.for === 'item') {
        syncRd(); const it = ds.for === 'item' ? S.rd.items[+ds.i] : null;
        openIconPick({for:ds.for, i:+ds.i}, it ? it.icon : S.rd.icon, it ? iconFor(it.name, 'charge') : '🏠');
      } else { const c = D().charges[ds.id]; if (c) openIconPick({for:ds.for, id:c.id}, c.icon, iconFor(c.name, c.kind === 'cost' ? 'cost' : 'charge')); }
      break;
    }
    case 'iconset': iconPicked(ds.v); break;
    case 'depset': openDeposit(ds.id); break;
    case 'ddadd': syncDep(); S.dep.ded.push({name:'', amtTxt:''}); renderDepSheet(); { const r = document.querySelectorAll('.ddn'); r[r.length - 1]?.focus(); } break;
    case 'dddel': syncDep(); S.dep.ded.splice(+ds.i, 1); renderDepSheet(); break;
    case 'depsave': saveDeposit(); break;
    case 'depundo': {
      const c = D().charges[S.dep.id], linked = chargesOf(c.r).filter(x => x.fromDep === c.id);
      if (linked.some(x => x.paidOn && x.name.startsWith('Dopłata'))) { if (!(await ask('Dopłata za szkody jest już oznaczona jako wpłacona. Cofnąć rozliczenie razem z nią?', 'Cofnij'))) return; }
      const n = clone(c); delete n.retOn; delete n.ret; delete n.ded; delete n.retTax;
      store.batch(() => { linked.forEach(x => store.deleteCharge(x.id)); store.saveCharge(n); });
      closeSheet(); toast('Rozliczenie cofnięte – kaucja znów u Ciebie', () => store.batch(() => { store.saveCharge(c); linked.forEach(x => store.saveCharge(x)); }));
      break;
    }
    case 'todep': {
      const c = D().charges[ds.id]; if (!c) return;
      const n = clone(c); n.kind = 'deposit'; delete n.taxable;
      store.saveCharge(n); closeSheet(); toast('Zamieniono na kaucję zwrotną – nie liczy się już do przychodu ani podatku', () => store.saveCharge(c));
      break;
    }
    case 'paid': openPayQuick([ds.id]); break;
    case 'paidall': openPayQuick(chargesOf(curR().id).filter(c => isIncome(c) && !c.paidOn && c.m === ds.m).map(c => c.id)); break;
    case 'pqd': $('#pq-date').value = ds.d; break;
    case 'pqsave': {
      const d = $('#pq-date').value, list = S.sheet.ids.map(id => D().charges[id]).filter(Boolean);
      if (!isDate(d)) { toast('Wpisz datę wpływu'); return; }
      const at = $('#pq-amt') ? $('#pq-amt').value.trim() : '';
      const p = at === '' ? null : parseZl(at);
      if (p !== null && (isNaN(p) || p <= 0)) { toast('Popraw kwotę'); return; }
      const note = $('#pq-note') ? $('#pq-note').value.trim() : null;
      store.batch(() => { for (const c of list) { const n = clone(c); n.paidOn = d; if (p !== null && p !== c.amount) n.paid = p; else delete n.paid; if (note !== null) { if (note) n.note = note; else delete n.note; } store.saveCharge(n); } });
      closeSheet();
      toast(`Wpłata zapisana: ${zl(p ?? sum(list, c => c.amount))}, ${d === todayStr() ? 'dziś' : shortDay(d)}`, () => store.batch(() => list.forEach(c => store.saveCharge(c))));
      break;
    }
    case 'charge': openCharge(ds.id); break;
    case 'papay': case 'pasave': {
      const c = D().charges[ds.id]; if (!c) return;
      const n = readCharge(c, a === 'papay' || !!c.paidOn); if (!n) return;
      if (write(() => store.saveCharge(n), a === 'papay' ? 'Wpłata zapisana' : 'Zapisano')) closeSheet();
      break;
    }
    case 'paundo': {
      const c = D().charges[ds.id]; if (!c) return;
      if (c.retOn) { toast('Najpierw cofnij rozliczenie kaucji'); return; }
      const n = clone(c); delete n.paidOn; delete n.paid;
      store.saveCharge(n); closeSheet(); toast('Wpłata cofnięta', () => store.saveCharge(c));
      break;
    }
    case 'padel': { const c = D().charges[ds.id]; if (c && await ask(`Usunąć należność „${c.name}”${c.kind === 'charge' ? ` za ${monthYear(c.m)}? Nie pojawi się ponownie sama – przywrócisz ją przyciskiem + → „Przywróć usunięte należności”.` : '?'}`)) deleteCharge(c); break; }
    case 'exsave': {
      const amt = parseZl($('#ex-amt').value), name = $('#ex-name').value.trim(), d = $('#ex-date').value;
      if (isNaN(amt) || amt <= 0) { toast('Wpisz kwotę'); return; }
      if (!name) { toast('Wpisz, za co'); return; }
      if (!isDate(d)) { toast('Wpisz termin'); return; }
      const c = {id:uid(), kind:'extra', r:S.sheet.r, m:d.slice(0, 7), d, name, amount:amt, taxable:$('#ex-tax').checked, ts:Date.now()}; if ($('#ex-pass').checked) c.pass = true;
      if (write(() => store.saveCharge(c), 'Dodano należność')) { setRid(c.r); closeSheet(); render(); }
      break;
    }

    /* koszty */
    case 'cost': openCost(ds.id); break;
    case 'cosave': {
      const amt = parseZl($('#co-amt').value), name = $('#co-name').value.trim(), d = $('#co-date').value;
      if (isNaN(amt) || amt <= 0) { toast('Wpisz kwotę'); return; }
      if (!name) { toast('Wpisz, za co'); return; }
      if (!isDate(d)) { toast('Wpisz datę'); return; }
      const old = S.sheet.id && D().charges[S.sheet.id];
      const c = Object.assign(old ? clone(old) : {id:uid(), kind:'cost', ts:Date.now()}, {r:S.sheet.r, name, amount:amt, d, note:$('#co-note').value.trim()});
      if (write(() => store.saveCharge(c), old ? 'Zapisano' : 'Dodano koszt')) { setRid(c.r); closeSheet(); render(); }
      break;
    }
    case 'codel': { const c = D().charges[ds.id]; if (c && await ask(`Usunąć koszt „${c.name}”?`)) { store.deleteCharge(c.id); closeSheet(); toast('Usunięto', () => store.saveCharge(c)); } break; }

    /* podatek */
    case 'tax': openTax(ds.r, ds.m); break;
    case 'taxpaid': { const x = taxEntries(ds.r).find(t => t.m === ds.m); if (x) markTaxPaid([x], todayStr()); break; }
    case 'taxpaidm': { const list = allTaxes().filter(x => x.m === ds.m && !x.paid); if (list.length) markTaxPaid(list, todayStr()); break; }
    case 'txplan': case 'txpay': {
      const {rid, m} = S.sheet, k = taxKey(rid, m), rec = clone(D().taxes[k] || {});
      const plan = $('#tx-plan').value; if (isDate(plan)) rec.payDate = plan; else delete rec.payDate;
      if (a === 'txpay') {
        const pd = $('#tx-paid').value, amt = parseZl($('#tx-amt').value);
        if (!isDate(pd)) { toast('Wpisz datę zapłaty'); return; }
        if (isNaN(amt) || amt < 0) { toast('Popraw kwotę'); return; }
        rec.paidOn = pd; rec.paidAmount = amt;
      }
      if (write(() => store.saveTax(k, rec), a === 'txpay' ? 'Podatek zapisany jako zapłacony' : 'Zapisano datę')) closeSheet();
      break;
    }
    case 'txundo': {
      const {rid, m} = S.sheet, k = taxKey(rid, m), prev = D().taxes[k]; if (!prev) return;
      const rec = clone(prev); delete rec.paidOn; delete rec.paidAmount;
      store.saveTax(k, rec); closeSheet(); toast('Zapłata cofnięta', () => store.saveTax(k, prev));
      break;
    }
  }
});
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('input', e => {
  if (e.target.id === 'tx-plan') txHint();
  if (S.dep && S.sheet && S.sheet.dep && e.target.closest('#sheet')) { syncDep(); const s = $('#dep-sum'); if (s) s.innerHTML = depSumHtml(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.sheet input')) { e.preventDefault(); e.target.blur(); } });

/* ---------- start ---------- */
store = REPORT ? LocalStore(REPORT, false) : LocalStore(null, true);
store.watch(render);
ensureCharges(); render();
// nowy miesiąc mógł się zacząć, gdy aplikacja była w tle
document.addEventListener('visibilitychange', () => { if (!document.hidden && ensureCharges()) render(); });

if (REPORT || !pinSupported()) { $('#lock').classList.add('hidden'); document.body.classList.remove('locked'); }
else if (pinRec()) lockOpen('unlock');
else if (lsGet(K.pinOff) === '1') { $('#lock').classList.add('hidden'); document.body.classList.remove('locked'); }
else lockOpen('setup', {cancellable:true, firstRun:true});

if (!REPORT && location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  setTimeout(() => loadXlsx().catch(() => {}), 3000);
  let lastUpdCheck = 0;
  const autoCheck = () => { if (navigator.onLine !== false && Date.now() - lastUpdCheck > 30 * 60e3) { lastUpdCheck = Date.now(); checkUpdate(); } };
  setTimeout(autoCheck, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) autoCheck(); });
}
</script>
</body>
